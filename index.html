<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyFitnessEnemy</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfaf8; --fg:#1e1c1a; --dim:#5a554e; --line:#e0dcd4; --accent:#791f1f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#f2efe9; --dim:#b8b3aa; --line:#33312e; --accent:#e08a86; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:90px 20px; }
  h1 { font-size:40px; margin:0 0 10px; letter-spacing:-1px; }
  p.tag { font-size:19px; color:var(--dim); margin:0 0 40px; }
  a.link { display:block; padding:16px 18px; border:1px solid var(--line); border-radius:12px;
           margin:10px 0; text-decoration:none; color:var(--fg);
           background:color-mix(in srgb, var(--fg) 4%, transparent); }
  a.link b { display:block; color:var(--accent); }
  a.link span { font-size:14px; color:var(--dim); }
  footer { margin-top:50px; color:var(--dim); font-size:13px; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>MyFitnessEnemy</h1>
  <p class="tag">Keep score. Have opinions.</p>

  <a class="link" href="./privacy.html"><b>Privacy Policy</b>
     <span>What the app stores, and what never leaves your phone.</span></a>
  <a class="link" href="./support.html"><b>Support</b>
     <span>Common questions and how to reach us.</span></a>

  <footer>
    Vestroash · Miami, FL ·
    <a href="mailto:vestroash@gmail.com">vestroash@gmail.com</a>
  </footer>
</main>
</body>
</html>
